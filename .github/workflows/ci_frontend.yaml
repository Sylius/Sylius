name: Frontend

on:
    workflow_dispatch: ~
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            type:
                description: "Type of the build"
                required: true
                type: string

permissions:
    contents: read

jobs:
    get-matrix:
        runs-on: ubuntu-latest
        name: "Get matrix"
        outputs:
            matrix: ${{ steps.matrix.outputs.prop }}
        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    persist-credentials: false
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                uses: actions/checkout@v4
                with:
                    persist-credentials: false
                if: "${{ inputs.branch == '' }}"
            -
                name: "Get matrix"
                id: matrix
                uses: notiz-dev/github-action-json-property@a5a9c668b16513c737c3e1f8956772c99c73f6e8 # v0.2.0
                with:
                    path: '.github/workflows/matrix.json'
                    prop_path: '${{ inputs.type }}.frontend'

    frontend:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "NodeJS ${{ matrix.node }}"
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: test_cached

        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    persist-credentials: false
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4
                with:
                    persist-credentials: false

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@fbdfc158a99f540fc3bbe554b46120d14444f2f4 # v4.3.0
                with:
                    build_type: "sylius"
                    e2e_js: "yes"
                    database: "mysql:8.4"
                    php_version: "8.5"
                    symfony_version: "~7.4.0"
                    node_version: ${{ matrix.node }}
                    chrome_version: stable
                    
            -   name: "Run javascript linter"
                run: yarn lint
