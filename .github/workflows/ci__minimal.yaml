name: Continuous Integration (Minimal)

on:
    pull_request:
        paths-ignore:
            - "adr/**"
            - "docs/**"
            - "*.md"
    workflow_dispatch: ~
    push:
        branches-ignore:
            - 'dependabot/**'
            - 'full-ci/**'
            - 'upmerge/**'

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}-minimal
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    static-checks:
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'full-ci/') }}
        name: Static checks
        uses: ./.github/workflows/ci_static-checks.yaml
        with:
            type: minimal
    e2e-mariadb:
        name: End-to-end tests (MariaDB)
        needs: static-checks
        uses: ./.github/workflows/ci_e2e-mariadb.yaml
        with:
            type: minimal
    e2e-mysql:
        name: End-to-end tests (MySQL)
        needs: static-checks
        uses: ./.github/workflows/ci_e2e-mysql.yaml
        with:
            type: minimal
    e2e-pgsql:
        name: End-to-end tests (PostgreSQL)
        needs: static-checks
        uses: ./.github/workflows/ci_e2e-pgsql.yaml
        with:
            type: minimal
    frontend:
        name: Frontend
        needs: static-checks
        uses: ./.github/workflows/ci_frontend.yaml
        with:
            type: minimal
    packages:
        name: Packages
        needs: static-checks
        uses: ./.github/workflows/ci_packages.yaml
        with:
            type: minimal
