name: Refactor

on:
    schedule:
        -
            cron: "0 2 * * *" # Run every day at 2am
    workflow_dispatch: ~

permissions:
    contents: write
    pull-requests: write

jobs:
    coding-standard:
        runs-on: ubuntu-latest

        name: "Coding standard refactor"

        timeout-minutes: 30

        if: github.repository == 'Sylius/Sylius'

        strategy:
            fail-fast: false
            matrix:
                include:
                    -
                        branch: "2.2"
                        php: "8.2"
                    -
                        branch: "2.3"
                        php: "8.3"

        steps:
            -
                uses: actions/checkout@v4
                with:
                    ref: ${{ matrix.branch }}

            -
                name: Setup PHP
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: ${{ matrix.php }}

            -
                name: Install PHP dependencies
                run: composer update --no-interaction --no-scripts

            -
                name: Run ECS
                run: vendor/bin/ecs check --fix src/Sylius

            -
                name: Create Pull Request
                uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4.2.4
                with:
                    commit-message: '[CS][DX] Refactor'
                    author: Sylius Bot <bot@sylius.org>
                    title: '[CS][DX] Refactor'
                    body: |
                        This PR has been generated automatically.
                        For more details see [refactor.yaml](/Sylius/Sylius/blob/2.3/.github/workflows/refactor.yaml).
                    labels: |
                        DX
                        Enhancement
                    branch: coding-standard/refactor-${{ matrix.branch }}
                    delete-branch: true
                    base: ${{ matrix.branch }}
