name: Test Parallel with Matrix Strategy

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set test matrix
        id: set-matrix
        run: |
          echo 'matrix={"include":[
            {"test": "phpunit", "name": "PHPUnit Tests", "command": "vendor/bin/phpunit --testsuite all --colors=always"},
            {"test": "cli", "name": "CLI Behat", "command": "vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags=\"@cli&&~@todo\" --suite-tags=\"@cli\""},
            {"test": "api", "name": "API/Domain Behat", "command": "vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags=\"~@todo&&~@cli\" --suite-tags=\"@api,@domain\""},
            {"test": "ui", "name": "UI Behat", "command": "vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags=\"~@javascript&&~@mink:chromedriver&&~@todo&&~@cli\" --suite-tags=\"@hybrid,@ui\""}
          ]}' >> $GITHUB_OUTPUT

  parallel-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.test-matrix) }}
    name: ${{ matrix.name }}
    env:
      APP_ENV: test_cached
      DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=8.0"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare manifest.json files
        run: |
          mkdir -p public/build/admin
          mkdir -p public/build/shop
          mkdir -p public/build/app/admin
          mkdir -p public/build/app/shop
          echo "{}" > public/build/admin/manifest.json
          echo "{}" > public/build/shop/manifest.json
          echo "{}" > public/build/app/admin/manifest.json
          echo "{}" > public/build/app/shop/manifest.json

      - name: Build application
        uses: SyliusLabs/BuildTestAppAction@v3.0.1
        with:
          build_type: "sylius"
          cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-matrix-${{ matrix.test }}"
          cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-matrix"
          e2e: "yes"
          database_version: "8.0"
          php_version: "8.3"
          symfony_version: "^7.1"
          node_version: "24.x"

      - name: Test installer (PHPUnit only)
        if: matrix.test == 'phpunit'
        run: bin/console sylius:install --no-interaction -vvv

      - name: Run ${{ matrix.name }}
        id: test
        run: |
          echo "Running: ${{ matrix.command }}"
          ${{ matrix.command }}

      - name: Rerun on failure
        if: failure() && matrix.test != 'phpunit'
        run: |
          echo "Retrying ${{ matrix.name }}..."
          # Behat rerun command
          vendor/bin/behat --strict --no-interaction -vvv -f progress --rerun

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "Logs (${{ matrix.name }}) - ${{ github.run_id }}-${{ github.run_number }}"
          path: |
            etc/build/
            var/log
          if-no-files-found: ignore
          overwrite: true