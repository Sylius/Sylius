name: End-to-End (PostgreSQL)

on:
    workflow_dispatch: ~
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            type:
                description: "Type of the build"
                required: true
                type: string

permissions:
    contents: read

jobs:
    get-matrix:
        runs-on: ubuntu-latest
        name: "Get matrix"
        outputs:
            matrix: ${{ steps.matrix.outputs.prop }}
        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                uses: actions/checkout@v4
                if: "${{ inputs.branch == '' }}"

            -   name: "Get matrix"
                id: matrix
                uses: notiz-dev/github-action-json-property@release
                with:
                    path: '.github/workflows/matrix.json'
                    prop_path: '${{ inputs.type }}.e2e-pgsql'

    behat-no-js:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "Non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, PostgreSQL ${{ matrix.postgres }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: test_cached
            DATABASE_URL: "pgsql://postgres:postgres@127.0.0.1/sylius?charset=utf8&serverVersion=${{ matrix.postgres }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Prepare manifest.json files
                if: "${{ inputs.branch != '1.14' }}"
                run: |
                    mkdir -p public/build/admin
                    mkdir -p public/build/shop
                    mkdir -p public/build/app/admin
                    mkdir -p public/build/app/shop
                    echo "{}" > public/build/admin/manifest.json
                    echo "{}" > public/build/shop/manifest.json
                    echo "{}" > public/build/app/admin/manifest.json
                    echo "{}" > public/build/app/shop/manifest.json

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-"
                    e2e: "yes"
                    database: "postgresql"
                    database_version: ${{ matrix.postgres }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Test installer
                run: bin/console sylius:install --no-interaction -vvv

            -   name: Run non-JS tests (reduced parallelism)
                run: |
                    set -o pipefail
                    export PGPASSWORD=postgres

                    # Run tests with reduced parallelism to avoid resource contention

                    # PHPUnit all tests (run first)
                    echo "::group::PHPUnit Tests"
                    vendor/bin/phpunit --testsuite all --colors=always
                    EXIT_PHPUNIT=$?
                    echo "::endgroup::"

                    if [ $EXIT_PHPUNIT -ne 0 ]; then
                        echo "::error::[UNIT] PHPUnit tests failed (exit code: $EXIT_PHPUNIT)"
                    fi

                    # Run CLI and API Behat in parallel (max 2 at a time)
                    (
                        echo "[CLI] Starting CLI tests..."
                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" 2>&1 | sed 's/^/[CLI  ] /'
                        echo $? > /tmp/exit_cli
                    ) &
                    PID_CLI=$!

                    (
                        echo "[API] Starting API/Domain tests..."
                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli&&~@no-postgres" --suite-tags="@api,@domain" 2>&1 | sed 's/^/[API  ] /'
                        echo $? > /tmp/exit_api
                    ) &
                    PID_API=$!

                    # Wait for CLI and API to complete
                    wait $PID_CLI $PID_API

                    EXIT_CLI=$(cat /tmp/exit_cli 2>/dev/null || echo 1)
                    EXIT_API=$(cat /tmp/exit_api 2>/dev/null || echo 1)

                    # Now run UI Behat (after CLI and API complete)
                    echo "[UI] Starting UI tests..."
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli&&~@no-postgres" --suite-tags="@hybrid,@ui" 2>&1 | sed 's/^/[UI   ] /'
                    EXIT_UI=$?

                    # Handle failures and reruns
                    FINAL_EXIT=0

                    if [ $EXIT_PHPUNIT -ne 0 ]; then
                        FINAL_EXIT=1
                    fi

                    if [ $EXIT_CLI -ne 0 ]; then
                        echo ""
                        echo "::error::[CLI] Tests failed, retrying..."
                        vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" --rerun 2>&1 | sed 's/^/[CLI-RETRY] /' || FINAL_EXIT=1
                    fi

                    if [ $EXIT_API -ne 0 ]; then
                        echo ""
                        echo "::error::[API] Tests failed, retrying..."
                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli&&~@no-postgres" --suite-tags="@api,@domain" --rerun 2>&1 | sed 's/^/[API-RETRY] /' || FINAL_EXIT=1
                    fi

                    if [ $EXIT_UI -ne 0 ]; then
                        echo ""
                        echo "::error::[UI] Tests failed, retrying..."
                        vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli&&~@no-postgres" --suite-tags="@hybrid,@ui" --rerun 2>&1 | sed 's/^/[UI-RETRY ] /' || FINAL_EXIT=1
                    fi

                    exit $FINAL_EXIT

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, PostgreSQL ${{ matrix.postgres }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true