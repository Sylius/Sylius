name: End-to-End (MySQL)

on:
    workflow_dispatch: ~
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            type:
                description: "Type of the build"
                required: true
                type: string

permissions:
    contents: read

jobs:
    get-matrix:
        runs-on: ubuntu-latest
        name: "Get matrix"
        outputs:
            matrix: ${{ steps.matrix.outputs.prop }}
        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                uses: actions/checkout@v4
                if: "${{ inputs.branch == '' }}"

            -   name: "Get matrix"
                id: matrix
                uses: notiz-dev/github-action-json-property@release
                with:
                    path: '.github/workflows/matrix.json'
                    prop_path: '${{ inputs.type }}.e2e-mysql'

    behat-no-js:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "Non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Prepare manifest.json files
                if: "${{ inputs.branch != '1.14' }}"
                run: |
                    mkdir -p public/build/admin
                    mkdir -p public/build/shop
                    mkdir -p public/build/app/admin
                    mkdir -p public/build/app/shop
                    echo "{}" > public/build/admin/manifest.json
                    echo "{}" > public/build/shop/manifest.json
                    echo "{}" > public/build/app/admin/manifest.json
                    echo "{}" > public/build/app/shop/manifest.json

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Fix permissions for Symfony logs directory
                run: |
                    LOGS_DIR=$(bin/console debug:container --parameter=kernel.logs_dir | grep 'kernel.logs_dir' | awk '{print $2}')
                    mkdir -p "$LOGS_DIR"
                    chmod -R 777 "$LOGS_DIR"

            -   name: Test installer
                run: bin/console sylius:install --no-interaction -vvv

            -   name: Run PHPUnit
                run: |
                    vendor/bin/phpunit --testsuite all --colors=always
                    vendor/bin/phpunit --testsuite="Sylius Test Suite" --colors=always

            -   name: Run CLI Behat
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" || vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" --rerun

            -   name: Run non-UI Behat
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" --rerun

            -   name: Run non-JS Behat
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" || vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    build-chromedriver-env:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "Build Chromedriver environment, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Upload built application
                uses: actions/upload-artifact@v4
                with:
                    name: "chromedriver-env-php${{ matrix.php }}-sf${{ matrix.symfony }}-mysql${{ matrix.mysql }}-${{ github.run_id }}"
                    path: |
                        .env
                        .env.test
                        .env.test.local
                        vendor/
                        var/
                        public/build/
                        public/media/
                        bin/
                        config/
                    retention-days: 1
                    overwrite: true

    behat-ui-js-chromedriver-admin-part1:
        needs: [get-matrix, build-chromedriver-env]
        runs-on: ubuntu-latest
        name: "Admin Part 1 (Product+Promotion), PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: Download built application
                uses: actions/download-artifact@v4
                with:
                    name: "chromedriver-env-php${{ matrix.php }}-sf${{ matrix.symfony }}-mysql${{ matrix.mysql }}-${{ github.run_id }}"

            -   name: Restore file permissions
                run: |
                    chmod +x vendor/bin/*
                    chmod +x bin/console

            -   name: Run Behat (Chromedriver) - Admin Product & Promotion
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion --rerun

            -   name: Run Behat (Chromedriver) - Admin Product & Promotion (@failing)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/product features/admin/promotion --rerun
                continue-on-error: true

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (Chromedriver Admin Part 1, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-chromedriver-admin-part2:
        needs: [get-matrix, build-chromedriver-env]
        runs-on: ubuntu-latest
        name: "Admin Part 2 (Others), PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: Download built application
                uses: actions/download-artifact@v4
                with:
                    name: "chromedriver-env-php${{ matrix.php }}-sf${{ matrix.symfony }}-mysql${{ matrix.mysql }}-${{ github.run_id }}"

            -   name: Restore file permissions
                run: |
                    chmod +x vendor/bin/*
                    chmod +x bin/console

            -   name: Run Behat (Chromedriver) - Admin Others
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory --rerun

            -   name: Run Behat (Chromedriver) - Admin Others (@failing)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@ui" \
                        features/admin/taxonomy features/admin/addressing features/admin/shipping \
                        features/admin/order features/admin/channel features/admin/user \
                        features/admin/currency features/admin/payment features/admin/locale \
                        features/admin/taxation features/admin/inventory --rerun
                continue-on-error: true

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (Chromedriver Admin Part 2, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-chromedriver-shop:
        needs: [get-matrix, build-chromedriver-env]
        runs-on: ubuntu-latest
        name: "Shop & Others, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: "Checkout"
                uses: actions/checkout@v4

            -   name: Download built application
                uses: actions/download-artifact@v4
                with:
                    name: "chromedriver-env-php${{ matrix.php }}-sf${{ matrix.symfony }}-mysql${{ matrix.mysql }}-${{ github.run_id }}"

            -   name: Restore file permissions
                run: |
                    chmod +x vendor/bin/*
                    chmod +x bin/console

            -   name: Run Behat (Chromedriver) - Shop & Hybrid
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&~@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid --rerun

            -   name: Run Behat (Chromedriver) - Shop & Hybrid (@failing)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress \
                        --tags="(@mink:chromedriver||@javascript)&&~@todo&&~@cli&&@failing" \
                        --suite-tags="@hybrid,@ui" \
                        features/shop features/hybrid --rerun
                continue-on-error: true

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (Chromedriver Shop, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-panther:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "JS with Panther, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Build application for Full 1.14 build
                if: "${{ inputs.branch == '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Build application
                if: "${{ inputs.branch != '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Run Behat (Panther)
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (JS with Panther, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true
