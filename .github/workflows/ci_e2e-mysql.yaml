name: End-to-End (MySQL)

on:
    workflow_dispatch: ~
    workflow_call:
        inputs:
            branch:
                description: "Branch"
                required: false
                type: string
                default: ""
            type:
                description: "Type of the build"
                required: true
                type: string

permissions:
    contents: read

jobs:
    get-matrix:
        runs-on: ubuntu-latest
        name: "Get matrix"
        outputs:
            matrix: ${{ steps.matrix.outputs.prop }}
        steps:
            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                uses: actions/checkout@v4
                if: "${{ inputs.branch == '' }}"

            -   name: "Get matrix"
                id: matrix
                uses: notiz-dev/github-action-json-property@release
                with:
                    path: '.github/workflows/matrix.json'
                    prop_path: '${{ inputs.type }}.e2e-mysql'

    behat-no-js:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "Non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Prepare manifest.json files
                if: "${{ inputs.branch != '1.14' }}"
                run: |
                    mkdir -p public/build/admin
                    mkdir -p public/build/shop
                    mkdir -p public/build/app/admin
                    mkdir -p public/build/app/shop
                    echo "{}" > public/build/admin/manifest.json
                    echo "{}" > public/build/shop/manifest.json
                    echo "{}" > public/build/app/admin/manifest.json
                    echo "{}" > public/build/app/shop/manifest.json

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Fix permissions for Symfony logs directory
                run: |
                    LOGS_DIR=$(bin/console debug:container --parameter=kernel.logs_dir | grep 'kernel.logs_dir' | awk '{print $2}')
                    mkdir -p "$LOGS_DIR"
                    chmod -R 777 "$LOGS_DIR"

            -   name: Test installer
                run: bin/console sylius:install --no-interaction -vvv

            -   name: Run non-JS tests (partially parallel)
                run: |
                    set -o pipefail

                    # Create a base database dump for faster cloning
                    mysqldump -h 127.0.0.1 -u root -proot sylius > /tmp/sylius_base.sql

                    # Run all test suites in parallel with TEST_TOKEN isolation

                    # PHPUnit all tests
                    (
                        sleep 0.1  # Small delay to avoid simultaneous DB operations
                        export TEST_TOKEN="phpunit"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"

                        # Create isolated database with retry
                        for i in 1 2 3; do
                            mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                            mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE sylius_${TEST_TOKEN} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" && break
                            sleep 1
                        done
                        mysql -h 127.0.0.1 -u root -proot sylius_${TEST_TOKEN} < /tmp/sylius_base.sql

                        vendor/bin/phpunit --testsuite all --colors=always 2>&1 | sed 's/^/[UNIT] /'
                        EXIT_CODE=$?

                        # Cleanup
                        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                        rm -rf /tmp/cache_${TEST_TOKEN} /tmp/log_${TEST_TOKEN} 2>/dev/null || true

                        echo $EXIT_CODE > /tmp/exit_phpunit
                    ) &
                    PID_PHPUNIT=$!

                    # CLI Behat
                    (
                        sleep 0.3  # Small delay to avoid simultaneous DB operations
                        export TEST_TOKEN="cli"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Create isolated database with retry
                        for i in 1 2 3; do
                            mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                            mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE sylius_${TEST_TOKEN} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" && break
                            sleep 1
                        done
                        mysql -h 127.0.0.1 -u root -proot sylius_${TEST_TOKEN} < /tmp/sylius_base.sql

                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" 2>&1 | sed 's/^/[CLI  ] /'
                        EXIT_CODE=$?

                        # Cleanup
                        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                        rm -rf /tmp/cache_${TEST_TOKEN} /tmp/log_${TEST_TOKEN} 2>/dev/null || true

                        echo $EXIT_CODE > /tmp/exit_cli
                    ) &
                    PID_CLI=$!

                    # API/Domain Behat
                    (
                        sleep 0.5  # Small delay to avoid simultaneous DB operations
                        export TEST_TOKEN="api"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Create isolated database with retry
                        for i in 1 2 3; do
                            mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                            mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE sylius_${TEST_TOKEN} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" && break
                            sleep 1
                        done
                        mysql -h 127.0.0.1 -u root -proot sylius_${TEST_TOKEN} < /tmp/sylius_base.sql

                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" 2>&1 | sed 's/^/[API  ] /'
                        EXIT_CODE=$?

                        # Cleanup
                        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                        rm -rf /tmp/cache_${TEST_TOKEN} /tmp/log_${TEST_TOKEN} 2>/dev/null || true

                        echo $EXIT_CODE > /tmp/exit_api
                    ) &
                    PID_API=$!

                    # UI (non-JS) Behat
                    (
                        sleep 0.7  # Small delay to avoid simultaneous DB operations
                        export TEST_TOKEN="ui"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Create isolated database with retry
                        for i in 1 2 3; do
                            mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                            mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE sylius_${TEST_TOKEN} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;" && break
                            sleep 1
                        done
                        mysql -h 127.0.0.1 -u root -proot sylius_${TEST_TOKEN} < /tmp/sylius_base.sql

                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" 2>&1 | sed 's/^/[UI   ] /'
                        EXIT_CODE=$?

                        # Cleanup
                        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS sylius_${TEST_TOKEN};" 2>/dev/null || true
                        rm -rf /tmp/cache_${TEST_TOKEN} /tmp/log_${TEST_TOKEN} 2>/dev/null || true

                        echo $EXIT_CODE > /tmp/exit_ui
                    ) &
                    PID_UI=$!

                    # Wait for all processes to complete
                    wait $PID_PHPUNIT
                    wait $PID_CLI
                    wait $PID_API
                    wait $PID_UI

                    # Read exit codes from files
                    EXIT_PHPUNIT=$(cat /tmp/exit_phpunit 2>/dev/null || echo 1)
                    EXIT_CLI=$(cat /tmp/exit_cli 2>/dev/null || echo 1)
                    EXIT_API=$(cat /tmp/exit_api 2>/dev/null || echo 1)
                    EXIT_UI=$(cat /tmp/exit_ui 2>/dev/null || echo 1)

                    # Handle failures and reruns
                    FINAL_EXIT=0

                    if [ "${EXIT_PHPUNIT:-0}" -ne 0 ]; then
                        echo ""
                        echo "::error::[UNIT] PHPUnit tests failed (exit code: ${EXIT_PHPUNIT})"
                        FINAL_EXIT=1
                    fi

                    if [ "${EXIT_CLI:-0}" -ne 0 ]; then
                        echo ""
                        echo "::error::[CLI] Tests failed, retrying..."
                        export TEST_TOKEN="cli"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Rerun uses same database
                        vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="@cli&&~@todo" --suite-tags="@cli" --rerun 2>&1 | sed 's/^/[CLI-RETRY] /' || FINAL_EXIT=1
                    fi

                    if [ "${EXIT_API:-0}" -ne 0 ]; then
                        echo ""
                        echo "::error::[API] Tests failed, retrying..."
                        export TEST_TOKEN="api"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Rerun uses same database
                        vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="~@todo&&~@cli" --suite-tags="@api,@domain" --rerun 2>&1 | sed 's/^/[API-RETRY] /' || FINAL_EXIT=1
                    fi

                    if [ "${EXIT_UI:-0}" -ne 0 ]; then
                        echo ""
                        echo "::error::[UI] Tests failed, retrying..."
                        export TEST_TOKEN="ui"
                        export DATABASE_URL="mysql://root:root@127.0.0.1/sylius_${TEST_TOKEN}?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"
                        export SYMFONY_CACHE_DIR="/tmp/cache_${TEST_TOKEN}"
                        export SYMFONY_LOG_DIR="/tmp/log_${TEST_TOKEN}"
                        # Behat cache handled by default, no BEHAT_PARAMS needed

                        # Rerun uses same database
                        vendor/bin/behat --strict --no-interaction -vvv -f progress --tags="~@javascript&&~@mink:chromedriver&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun 2>&1 | sed 's/^/[UI-RETRY ] /' || FINAL_EXIT=1
                    fi

                    exit $FINAL_EXIT

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (non-JS, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-chromedriver:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "JS with Chromedriver, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Build application
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}

            -   name: Run Behat (Chromedriver)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&~@failing" --suite-tags="@hybrid,@ui" --rerun

            -   name: Run Behat (Chromedriver) for randomly failing scenarios (@failing)
                run: |
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" --rerun || \
                    vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@mink:chromedriver&&~@todo&&~@cli&&@failing" --suite-tags="@hybrid,@ui" --rerun
                continue-on-error: true

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (JS with Chromedriver, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true

    behat-ui-js-panther:
        needs: get-matrix
        runs-on: ubuntu-latest
        name: "JS with Panther, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} (${{ matrix.env || 'test_cached' }}), MySQL ${{ matrix.mysql }}, Twig ${{ matrix.twig }}"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

        env:
            APP_ENV: ${{ matrix.env || 'test_cached' }}
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?charset=utf8mb4&serverVersion=${{ matrix.mysql }}"

        steps:
            -   name: Set variables
                shell: bash
                env:
                    BRANCH: ${{ inputs.branch }}
                run: |
                    if [ "$BRANCH" == "1.14" ]; then
                        echo "NODE_VERSION=20.x" >> $GITHUB_ENV
                    elif [ "$BRANCH" == "2.0" ]; then
                        echo "NODE_VERSION=22.x" >> $GITHUB_ENV
                    else
                        echo "NODE_VERSION=24.x" >> $GITHUB_ENV
                    fi

            -   name: "Checkout (With Branch)"
                if: "${{ inputs.branch != '' }}"
                uses: actions/checkout@v4
                with:
                    ref: ${{ inputs.branch }}

            -   name: "Checkout"
                if: "${{ inputs.branch == '' }}"
                uses: actions/checkout@v4

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: "Restore dependencies"
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"

            -   name: Restrict Twig
                if: matrix.twig == '^2.12'
                run: composer require --no-update --no-scripts --no-interaction "twig/twig:${{ matrix.twig }}"

            -   name: Build application for Full 1.14 build
                if: "${{ inputs.branch == '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Build application
                if: "${{ inputs.branch != '1.14' }}"
                uses: SyliusLabs/BuildTestAppAction@v3.0.1
                with:
                    build_type: "sylius"
                    cache_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    cache_restore_key: "${{ github.run_id }}-${{ runner.os }}-${{ hashFiles('composer.json') }}-symfony-${{ matrix.symfony }}"
                    e2e: "yes"
                    e2e_js: "yes"
                    database_version: ${{ matrix.mysql }}
                    php_version: ${{ matrix.php }}
                    symfony_version: ${{ matrix.symfony }}
                    node_version: ${{ env.NODE_VERSION }}
                    chrome_version: stable

            -   name: Run Behat (Panther)
                run: vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun || vendor/bin/behat --colors --strict --no-interaction -vvv -f progress --tags="@javascript&&~@todo&&~@cli" --suite-tags="@hybrid,@ui" --rerun

            -   name: Upload logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Logs (JS with Panther, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, Twig ${{ matrix.twig }}, MySQL ${{ matrix.mysql }}) - ${{ github.run_id }}-${{ github.run_number }}"
                    path: |
                        etc/build/
                        var/log
                    if-no-files-found: ignore
                    overwrite: true
