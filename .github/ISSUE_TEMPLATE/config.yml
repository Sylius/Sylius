      about: Are you looking for additional features in Sylius? Check out Sylius Plus - the edition with advanced, time-saving features tailored for complex implementations
    - name: ⚠️ Security Issue
      url: https://docs.sylius.com/the-book/contributing/contributing-code/security-issues
      about: If you think that you have found a security issue in Sylius, please do not use the issue tracker and do not post it publicly. Instead, all security issues must be sent to `security@sylius.com`.
