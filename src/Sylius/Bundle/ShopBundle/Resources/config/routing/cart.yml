sylius_shop_cart_summary:
    path: /
    methods: [GET]
    condition: "context.isSyliusRoutingBcLayerEnabled('shop_cart_summary')"
    defaults:
        _controller: sylius.controller.order::summaryAction
        _sylius:
            template: "@SyliusShop/cart/index.html.twig"
            form: Sylius\Bundle\ShopBundle\Form\Type\CartType
            
_sylius_shop_cart_summary:
    path: /
    methods: [GET]
    condition: "not context.isSyliusRoutingBcLayerEnabled('shop_cart_summary')"
    controller: sylius_shop.controller.cart_summary          

sylius_shop_cart_checkout:
    path: /checkout
    methods: [PATCH]
    condition: "context.isSyliusRoutingBcLayerEnabled('shop_cart_checkout')"
    defaults:
        _controller: sylius.controller.order::saveAction
        _sylius:
            template: "@SyliusShop/cart/index.html.twig"
            redirect: sylius_shop_checkout_start
            form: Sylius\Bundle\ShopBundle\Form\Type\CartType
            flash: false

_sylius_shop_cart_checkout:
    path: /checkout
    methods: [PATCH, POST]
    condition: "not context.isSyliusRoutingBcLayerEnabled('shop_cart_checkout')"
    controller: sylius_shop.controller.cart_checkout
