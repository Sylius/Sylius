sylius_twig_hooks:
    hooks:
        'sylius_admin.payment_method.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    documentation_url: 'https://docs.sylius.com/public/getting-started/payments?utm_source=sylius_admin&utm_medium=header&utm_campaign=payment_plugins&utm_content=payment_methods_header'
                priority: 100

        'sylius_admin.payment_method.index.content':
            banner:
                template: '@SyliusAdmin/payment_method/index/content/banner.html.twig'
                priority: 150

        'sylius_admin.payment_method.index.content.banner':
            stripe:
                template: '@SyliusAdmin/payment_method/index/content/banner/slide.html.twig'
                priority: 400
                configuration:
                    active: true
                    variant: 'stripe'
                    image: 'build/admin/images/stripe-logo.webp'
                    title: 'sylius.ui.payment_method_banner.stripe.title'
                    description: 'sylius.ui.payment_method_banner.stripe.description'
                    payment_methods: ['visa', 'master_card', 'amex', 'apple_pay', 'google_pay', 'klarna']
                    payment_methods_more: true
                    bundle: 'FluxSESyliusStripePlugin'
                    documentation_url: 'https://docs.sylius.com/public/stripe-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=stripe_docs'
                    plugin_url: 'https://addons.sylius.com/en_US/products/stripe-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=stripe_plugin'
            paypal:
                template: '@SyliusAdmin/payment_method/index/content/banner/slide.html.twig'
                priority: 300
                configuration:
                    variant: 'paypal'
                    image: 'build/admin/images/paypal-logo.svg'
                    title: 'sylius.ui.payment_method_banner.paypal.title'
                    description: 'sylius.ui.payment_method_banner.paypal.description'
                    payment_methods: ['visa', 'master_card', 'amex', 'paypal', 'venmo', 'apple_pay']
                    payment_methods_more: true
                    bundle: 'SyliusPayPalPlugin'
                    documentation_url: 'https://docs.sylius.com/public/paypal-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=paypal_docs'
                    plugin_url: 'https://addons.sylius.com/en_US/products/paypal-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=paypal_plugin'
            adyen:
                template: '@SyliusAdmin/payment_method/index/content/banner/slide.html.twig'
                priority: 200
                configuration:
                    variant: 'adyen'
                    image: 'build/admin/images/adyen-logo.svg'
                    title: 'sylius.ui.payment_method_banner.adyen.title'
                    description: 'sylius.ui.payment_method_banner.adyen.description'
                    payment_methods: ['visa', 'master_card', 'amex', 'alipay', 'wechat_pay', 'klarna']
                    payment_methods_more: true
                    bundle: 'SyliusAdyenPlugin'
                    documentation_url: 'https://docs.sylius.com/public/adyen-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=adyen_docs'
                    plugin_url: 'https://addons.sylius.com/en_US/products/adyen-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=adyen_plugin'
            mollie:
                template: '@SyliusAdmin/payment_method/index/content/banner/slide.html.twig'
                priority: 100
                configuration:
                    variant: 'mollie'
                    image: 'build/admin/images/mollie-logo.svg'
                    title: 'sylius.ui.payment_method_banner.mollie.title'
                    description: 'sylius.ui.payment_method_banner.mollie.description'
                    payment_methods: ['visa', 'master_card', 'maestro', 'ideal', 'bancontact', 'blik']
                    payment_methods_more: true
                    bundle: 'SyliusMolliePlugin'
                    documentation_url: 'https://docs.sylius.com/public/mollie-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=mollie_docs'
                    plugin_url: 'https://addons.sylius.com/en_US/products/mollie-plugin?utm_source=sylius_admin&utm_medium=banner&utm_campaign=payment_plugins&utm_content=mollie_plugin'
