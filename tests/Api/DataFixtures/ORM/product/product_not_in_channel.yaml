Sylius\Component\Core\Model\Channel:
    channel_web:
        code: 'WEB'
        name: 'Web Channel'
        hostname: 'localhost'
        description: 'Lorem ipsum'
        baseCurrency: '@currency_usd'
        defaultLocale: '@locale_en'
        locales: ['@locale_en']
        color: 'black'
        enabled: true
        taxCalculationStrategy: 'order_items_based'
    channel_mobile:
        code: 'MOBILE'
        name: 'Mobile Channel'
        hostname: 'mobile.localhost'
        description: 'Lorem ipsum'
        baseCurrency: '@currency_usd'
        defaultLocale: '@locale_en'
        locales: ['@locale_en']
        color: 'blue'
        enabled: true
        taxCalculationStrategy: 'order_items_based'

Sylius\Component\Currency\Model\Currency:
    currency_usd:
        code: 'USD'

Sylius\Component\Locale\Model\Locale:
    locale_en:
        code: 'en_US'

Sylius\Component\Core\Model\Product:
    product_in_web_channel:
        code: 'MUG'
        channels: ['@channel_web']
        currentLocale: 'en_US'
    product_in_mobile_channel_only:
        code: 'T_SHIRT'
        channels: ['@channel_mobile']
        currentLocale: 'en_US'

Sylius\Component\Core\Model\ProductTranslation:
    product_translation_mug_en:
        slug: 'mug'
        locale: 'en_US'
        name: 'Mug'
        description: 'A mug'
        shortDescription: 'Mug'
        translatable: '@product_in_web_channel'
    product_translation_tshirt_en:
        slug: 't-shirt'
        locale: 'en_US'
        name: 'T-Shirt'
        description: 'A t-shirt'
        shortDescription: 'T-Shirt'
        translatable: '@product_in_mobile_channel_only'
